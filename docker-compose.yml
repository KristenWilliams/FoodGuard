services:
  foodguard-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: foodguard-api
    restart: unless-stopped
    env_file:
      - .env.server.local
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    ports:
      - "127.0.0.1:18787:8787"
